# Render: Easy NL2SQL — Docker web service (./Dockerfile).
#
# IMPORTANT — this file is used only for Blueprint / IaC deploys. If you created the
# service with Dashboard → New → Web Service (not Blueprint), Render IGNORES render.yaml
# and uses whatever Environment you picked (Python → python-env.sh + render-build-tool).
#
# If logs show python-env.sh + render-build-tool: the service is still NATIVE Python,
# not Docker. Editing this repo cannot flip that runtime; see RENDER_FIX.txt.
#
# FASTEST fix (no Blueprint required):
#   Dashboard → New + → Web Service → repo → branch main
#   → Environment: **Docker** → Dockerfile Path: Dockerfile → Root Directory: (empty)
#   → copy env vars from broken service → Create. When healthy, delete OLD service and
#   point your *.onrender.com / custom domain at the new one. Update API_BASE_URL in static UIs if URL changes.
#
# If you use Blueprints: Blueprints → sync this repo; runtime change must apply there
# (Dashboard cannot edit runtime on an existing service). See:
# https://render.com/docs/native-runtimes#changing-a-services-runtime
#
# Clone line "403": GitHub access (private repo). Account Settings → GitHub → reconnect
# or grant this repo to the Render app.
#
# Python eval deps: experiments/eval-requirements.txt — never commit requirements.txt at repo root.

services:
  - type: web
    name: phrasesql
    runtime: docker
    # GitHub repository URL (folder name may differ from service display name)
    repo: https://github.com/sanmish4ds/SQLclMCP
    plan: free
    branch: main
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    dockerContext: .

    envVars:
      - key: ENABLE_LLM_SQL_GEN
        value: "true"
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: TNS_ADMIN
        value: /app/wallet
      - key: ORACLE_WALLET_PATH
        value: /app/wallet
      # NeMo Guardrails sidecar (service "easynlsql-guardrails" below).
      # GUARDRAILS_URL: set to that service's URL, e.g. https://easynlsql-guardrails.onrender.com
      - key: GUARDRAILS_URL
        sync: false
      - key: GUARDRAILS_TOKEN
        fromService:
          type: web
          name: easynlsql-guardrails
          envVarKey: GUARDRAILS_TOKEN
      # open (default): if the sidecar is down, fall back to local checks; closed: reject with 503
      - key: GUARDRAILS_FAIL_MODE
        value: open
      # Render free instances cold-start in ~30-60s; keep timeout short so a sleeping sidecar fails open fast.
      - key: GUARDRAILS_TIMEOUT_MS
        value: "8000"
      # /api/invoke run-sql DDL/DML (autoCommit). Off = read-only lab.
      - key: LAB_ALLOW_DML
        value: "false"
      # Optional: ElevenLabs podcast TTS for guided “Listen” (POST /guided-podcast-tts)
      # - ELEVENLABS_API_KEY
      # - ELEVENLABS_GUIDED_LISTEN_ONLY=true (optional; no browser speech fallback for Listen)
      # - ELEVENLABS_VOICE_ID — primary female voice (default Rachel premade)
      # - ELEVENLABS_DIALOGUE_VOICE_ID — second female voice for dialogue (e.g. Bella; must differ)
      # - ELEVENLABS_MODEL_ID (optional; default eleven_turbo_v2_5 — faster Listen)
      # - ELEVENLABS_TTS_PARALLEL (optional; default 8 — parallel TTS segments)
      # - ELEVENLABS_FALLBACK_MODEL_ID, ELEVENLABS_OUTPUT_FORMAT (optional)
      # Set these in Render Dashboard → Environment (never commit real values):
      # - LLM_API_KEY
      # - LLM_API_URL (optional, default OpenAI)
      # - DB_DSN (e.g. prishivdb1_high), DB_USER, DB_PASSWORD
      # - DB_HOST, DB_PORT, DB_SID (optional, for /health display)
      # - ORACLE_WALLET_ZIP_B64 (base64 of your Autonomous DB wallet zip)
      # - APP_DISPLAY_NAME (optional UI/API label; default Easy NL2SQL)

  # NVIDIA NeMo Guardrails sidecar: input/output rails for the Node API (guardrails/server.py).
  - type: web
    name: easynlsql-guardrails
    runtime: docker
    repo: https://github.com/sanmish4ds/SQLclMCP
    plan: free
    branch: main
    healthCheckPath: /health
    dockerfilePath: ./guardrails/Dockerfile
    dockerContext: .
    envVars:
      - key: GUARDRAILS_TOKEN
        generateValue: true
      - key: GUARDRAILS_LLM_CHECKS
        value: "true"
      - key: GUARDRAILS_MODEL
        value: gpt-4o-mini
      # Set in Dashboard (same key as the Node service): LLM_API_KEY, optional LLM_API_URL
      - key: LLM_API_KEY
        sync: false
